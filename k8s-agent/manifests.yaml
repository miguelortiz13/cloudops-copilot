apiVersion: v1
kind: Namespace
metadata:
  name: cloudops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudops-agent
automountServiceAccountToken: true
---
# Solo lectura y sin secrets ni configmaps.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cloudops-agent-read
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, pods, services, events]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get, list]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cloudops-agent-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloudops-agent-read
subjects:
  - kind: ServiceAccount
    name: cloudops-agent
    namespace: cloudops
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudops-agent
  labels:
    app.kubernetes.io/name: cloudops-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudops-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudops-agent
    spec:
      serviceAccountName: cloudops-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: python:3.13.9-alpine
          command: [python, /agent/agent.py]
          env:
            - name: CLUSTER_NAME
              valueFrom:
                secretKeyRef: {name: cloudops-agent, key: cluster-name}
            - name: UPLOAD_URL
              valueFrom:
                secretKeyRef: {name: cloudops-agent, key: upload-url}
            - name: INTERVAL_SECONDS
              value: "300"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          resources:
            requests: {cpu: 10m, memory: 48Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - {name: agent, mountPath: /agent, readOnly: true}
      volumes:
        - name: agent
          configMap:
            name: cloudops-agent
