# Actualizaciones automáticas de dependencias: un PR semanal por ecosistema,
# agrupando parches y versiones menores para no inundar el repositorio.
version: 2
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule: { interval: weekly, day: monday }
    groups:
      python-menores:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday }
    groups:
      npm-menores:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: docker
    directory: /backend
    schedule: { interval: weekly, day: monday }
  - package-ecosystem: terraform
    directory: /infra/terraform
    schedule: { interval: weekly, day: monday }
