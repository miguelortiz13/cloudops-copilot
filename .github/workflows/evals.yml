name: Evals de IA

# Corrida semanal de los evals con el modelo real (plan 11, hito IA-1): el asistente, el diagnóstico de
# incidentes y la IA de cada dominio (con el chequeo de cifras inventadas). El resultado se publica en
# Plataforma → IA. Unos cientos de llamadas al modelo por semana: centavos. Sin los secretos, no corre.
on:
  schedule:
    - cron: "0 7 * * 1"   # lunes 07:00 UTC, después del job diario
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evals:
    name: Evals con el modelo real
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ALERTS_INGEST_TOKEN: ${{ secrets.ALERTS_INGEST_TOKEN }}
      API_URL: ${{ vars.API_URL }}
    steps:
      - name: Sin clave del modelo, no hay evals
        if: env.GEMINI_API_KEY == ''
        run: 'echo "::notice::Falta el secreto GEMINI_API_KEY, los evals no corren."'
      - uses: actions/checkout@v7
        if: env.GEMINI_API_KEY != ''
      - uses: actions/setup-python@v7
        if: env.GEMINI_API_KEY != ''
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Dependencias
        if: env.GEMINI_API_KEY != ''
        run: pip install -r requirements.txt
      - name: Suites
        if: env.GEMINI_API_KEY != ''
        # Cada suite en su proceso (prepara su base temporal al importar); una que falla no frena a las demás.
        run: |
          mkdir -p resultados
          python -m eval.agentes --json resultados/asistente.json || true
          python -m eval.incidentes --json resultados/incidentes.json || true
          python -m eval.dominios --json resultados/dominios.json || true
      - name: Resumen
        if: env.GEMINI_API_KEY != ''
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, json
          print("| Suite | Correctos | Exactitud | Cifras inventadas |\n|---|---|---|---|")
          for ruta in sorted(glob.glob("resultados/*.json")):
              s = json.load(open(ruta))
              print(f"| {s['suite']} | {s['passed']}/{s['cases']} | {s['accuracy']:.0%} | {s['invented_numbers']} |")
          PY
      - name: Publicar en Plataforma → IA
        if: env.GEMINI_API_KEY != ''
        run: python -m eval.publicar resultados/*.json
      - uses: actions/upload-artifact@v7
        if: env.GEMINI_API_KEY != ''
        with:
          name: evals
          path: backend/resultados
          retention-days: 90
      - name: Objetivo (90 % por suite, cero cifras inventadas)
        if: env.GEMINI_API_KEY != ''
        run: |
          python - <<'PY'
          import glob, json, sys
          malas = [s["suite"] for s in map(lambda r: json.load(open(r)), glob.glob("resultados/*.json"))
                   if (s["accuracy"] or 0) < s["target"] or s["invented_numbers"]]
          print("Por debajo del objetivo:", malas or "ninguna")
          sys.exit(1 if malas else 0)
          PY
