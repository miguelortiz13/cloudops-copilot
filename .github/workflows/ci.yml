name: CI

# Pasos estándar con miguelortiz13/github-workflows; las pruebas E2E, el
# terraform validate y la auditoría completa de dependencias son propios.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    uses: miguelortiz13/github-workflows/.github/workflows/build-python.yml@v0.3.0
    with:
      python-version: "3.13"
      working-directory: backend
      requirements: requirements.txt requirements-dev.txt
      commands: |
        ruff check app tests
        python -m pytest

  frontend:
    name: Frontend (eslint + Vitest + build)
    uses: miguelortiz13/github-workflows/.github/workflows/build-node.yml@v0.3.0
    with:
      node-version: "22"
      working-directory: frontend
      install-command: npm ci --no-audit --no-fund
      scripts: lint test build

  e2e:
    name: Frontend E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Solo para leer la versión de Playwright: las pruebas corren dentro de su
      # imagen oficial (la misma con la que se generaron las capturas).
      - run: npm ci --no-audit --no-fund
      - run: ./scripts/e2e-docker.sh
      - name: Reporte de Playwright
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  terraform:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  secrets:
    name: Seguridad (gitleaks + dependency review)
    uses: miguelortiz13/github-workflows/.github/workflows/security-baseline.yml@v0.3.0
    permissions:
      contents: read
      pull-requests: write

  dependencies:
    name: Vulnerabilidades en dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: pip-audit (backend)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: npm audit (frontend)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high

  # La imagen del API se construye y escanea en cd.yml (umbral HIGH,CRITICAL).
  # Aquí solo se comprueba que la del panel compile; no se publica.
  web-image:
    name: Imagen del panel (build + Trivy)
    uses: miguelortiz13/github-workflows/.github/workflows/container-build.yml@v0.3.0
    permissions:
      contents: read
      packages: write
    with:
      image-name: cloudops-copilot-web
      context: frontend
      push: false
