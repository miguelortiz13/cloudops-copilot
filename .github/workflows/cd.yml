name: CD

# Publica la imagen del API en GitHub Container Registry y despliega en el
# ambiente `dev` cada vez que algo llega a `main`.
#
# - Sin secretos de larga vida: Azure se autentica por OIDC con una identidad
#   administrada (infra/terraform/cicd.tf) que solo puede actuar sobre el grupo
#   de recursos de la plataforma, y GHCR con el GITHUB_TOKEN de la ejecución.
# - En los PRs solo se construye y publica la imagen (etiqueta pr-N), para
#   detectar fallos de build antes del merge; no se despliega nada.
# - Los cambios de infraestructura no pasan por aquí: se aplican con Terraform.

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths: ["backend/**", ".github/workflows/cd.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/cloudops-copilot-api

jobs:
  image:
    name: Imagen del API
    runs-on: ubuntu-latest
    # Los PRs desde forks no pueden publicar en el registro del repositorio.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "tags=${IMAGE}:pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
            echo "ref=${IMAGE}:pr-${{ github.event.number }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:${{ github.sha }},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
            echo "ref=${IMAGE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ${{ steps.tag.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=API de CloudOps Copilot

  deploy-dev:
    name: Desplegar en dev
    needs: image
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Actualizar la imagen del API
        run: |
          az containerapp update \
            --name "${{ vars.CONTAINER_APP }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --image "${{ needs.image.outputs.ref }}" \
            --output none

      - name: Esperar la nueva revisión
        run: |
          for i in $(seq 1 40); do
            read -r estado salud <<< "$(az containerapp revision list \
              --name "${{ vars.CONTAINER_APP }}" --resource-group "${{ vars.RESOURCE_GROUP }}" \
              --query "sort_by([?properties.template.containers[0].image=='${{ needs.image.outputs.ref }}'], &properties.createdTime)[-1].[properties.provisioningState, properties.healthState]" \
              -o tsv)"
            echo "intento $i: aprovisionamiento=${estado:-?} salud=${salud:-?}"
            [ "$estado" = "Failed" ] && exit 1
            [ "$estado" = "Provisioned" ] && [ "$salud" != "Unhealthy" ] && exit 0
            sleep 15
          done
          echo "La revisión no quedó lista a tiempo" && exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compilar el panel
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_AZURE_AD_CLIENT_ID: ${{ secrets.VITE_AZURE_AD_CLIENT_ID }}
          VITE_AZURE_AD_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          VITE_API_SCOPE: ${{ secrets.VITE_API_SCOPE }}
          VITE_USER_DISPLAY_NAME: ${{ vars.USER_DISPLAY_NAME }}
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Token de despliegue de la Static Web App
        id: swa
        run: |
          token=$(az staticwebapp secrets list --name "${{ vars.STATIC_WEB_APP }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" --query properties.apiKey -o tsv)
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Publicar el panel
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: frontend/dist
          skip_app_build: true
          skip_api_build: true

      - name: Prueba de humo
        env:
          API: ${{ secrets.VITE_API_URL }}
        run: |
          panel="https://$(az staticwebapp show --name "${{ vars.STATIC_WEB_APP }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" --query defaultHostname -o tsv)"
          echo "::add-mask::$panel"
          falla=0
          comprobar() { if [ "$2" = "$3" ]; then echo "OK    $1"; else echo "FALLA $1 (esperado $3, obtenido $2)"; falla=1; fi; }

          # El primer arranque tras escalar a cero puede tardar.
          for i in $(seq 1 20); do
            codigo=$(curl -s -m 30 -o /dev/null -w "%{http_code}" "$API/api/inventory/health")
            [ "$codigo" = "200" ] && break; sleep 10
          done
          comprobar "health del API" "$codigo" 200
          comprobar "API sin token" "$(curl -s -m 30 -o /dev/null -w "%{http_code}" "$API/api/inventory/subscriptions")" 401
          comprobar "panel" "$(curl -s -m 30 -o /dev/null -w "%{http_code}" "$panel/")" 200
          csp=$(curl -sI -m 30 "$panel/" | grep -ci "content-security-policy" || true)
          comprobar "cabecera CSP del panel" "$csp" 1
          exit $falla
