name: CD

# Publica la imagen del API en GitHub Container Registry y despliega en el
# ambiente `dev` cada vez que algo llega a `main`, con los workflows estándar de
# miguelortiz13/github-workflows.
#
# - Sin secretos de larga vida: Azure se autentica por OIDC con una identidad
#   administrada (infra/terraform/cicd.tf) que solo puede actuar sobre el grupo
#   de recursos de la plataforma, y GHCR con el GITHUB_TOKEN de la ejecución.
# - En los PRs la imagen se construye y escanea, pero no se publica ni despliega.
# - Solo se despliega una imagen firmada (Cosign) con su SBOM atestado.
# - Los cambios de infraestructura no pasan por aquí: se aplican con Terraform.

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths: ["backend/**", ".github/workflows/cd.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Imagen del API
    uses: miguelortiz13/github-workflows/.github/workflows/container-build.yml@v0.3.0
    permissions:
      contents: read
      packages: write
    with:
      image-name: cloudops-copilot-api
      context: backend
      # Vulnerabilidades altas o críticas con corrección disponible: las que no
      # tienen parche no son accionables y solo generarían ruido.
      fail-severity: HIGH,CRITICAL
      push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

  sign:
    name: Firma y SBOM
    needs: image
    if: needs.image.outputs.ref != ''
    uses: miguelortiz13/github-workflows/.github/workflows/container-sign.yml@v0.3.0
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      image-ref: ${{ needs.image.outputs.ref }}

  api:
    name: Desplegar el API en dev
    needs: [image, sign]
    uses: miguelortiz13/github-workflows/.github/workflows/deploy-azure-container-app.yml@v0.3.0
    permissions:
      contents: read
      id-token: write
    with:
      environment: dev
      app-name: ${{ vars.CONTAINER_APP }}
      resource-group: ${{ vars.RESOURCE_GROUP }}
      image: ${{ needs.image.outputs.image }}:${{ needs.image.outputs.tag }}
      # El recolector diario usa la misma imagen (no se ejecuta aquí: cada
      # ejecución despierta la base). El job de avisos de Kubernetes solo existe
      # con clústeres configurados (infra/terraform/kubernetes.tf).
      jobs: ${{ vars.CONTAINER_APP_JOB }} ${{ vars.CONTAINER_APP_JOB_K8S }}?
      health-path: /api/inventory/health

  web:
    name: Publicar el panel en dev
    needs: api
    uses: miguelortiz13/github-workflows/.github/workflows/deploy-azure-static-web-app.yml@v0.3.0
    permissions:
      contents: read
      id-token: write
    with:
      environment: dev
      app-name: ${{ vars.STATIC_WEB_APP }}
      resource-group: ${{ vars.RESOURCE_GROUP }}
      working-directory: frontend
      build-command: npm ci --no-audit --no-fund && npm run build
      build-env: |
        VITE_USER_DISPLAY_NAME=${{ vars.USER_DISPLAY_NAME }}
    secrets:
      build-secrets: |
        VITE_API_URL=${{ secrets.VITE_API_URL }}
        VITE_AZURE_AD_CLIENT_ID=${{ secrets.VITE_AZURE_AD_CLIENT_ID }}
        VITE_AZURE_AD_TENANT_ID=${{ secrets.VITE_AZURE_AD_TENANT_ID }}
        VITE_API_SCOPE=${{ secrets.VITE_API_SCOPE }}

  smoke:
    name: Prueba de humo
    needs: web
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Prueba de humo
        env:
          API: ${{ secrets.VITE_API_URL }}
        run: |
          panel="https://$(az staticwebapp show --name "${{ vars.STATIC_WEB_APP }}" \
            --resource-group "${{ vars.RESOURCE_GROUP }}" --query defaultHostname -o tsv)"
          echo "::add-mask::$panel"
          falla=0
          comprobar() { if [ "$2" = "$3" ]; then echo "OK    $1"; else echo "FALLA $1 (esperado $3, obtenido $2)"; falla=1; fi; }

          # El primer arranque tras escalar a cero puede tardar.
          for _ in $(seq 1 20); do
            codigo=$(curl -s -m 30 -o /dev/null -w "%{http_code}" "$API/api/inventory/health")
            [ "$codigo" = "200" ] && break; sleep 10
          done
          comprobar "health del API" "$codigo" 200
          comprobar "API sin token" "$(curl -s -m 30 -o /dev/null -w "%{http_code}" "$API/api/inventory/subscriptions")" 401
          comprobar "panel" "$(curl -s -m 30 -o /dev/null -w "%{http_code}" "$panel/")" 200
          csp=$(curl -sI -m 30 "$panel/" | grep -ci "content-security-policy" || true)
          comprobar "cabecera CSP del panel" "$csp" 1
          exit $falla
